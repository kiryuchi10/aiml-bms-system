# BMS Suite: MySQL + Backend + Frontend (all in one)
# Usage: docker compose up -d
# Then open http://localhost:5173 (frontend) — API at http://localhost:8000

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "root12345"
      MYSQL_DATABASE: aimlbms
      MYSQL_USER: bms
      MYSQL_PASSWORD: "12345"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot12345"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql+pymysql://bms:12345@db:3306/aimlbms"
      ALLOW_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
    depends_on:
      - backend

volumes:
  mysql_data: {}
