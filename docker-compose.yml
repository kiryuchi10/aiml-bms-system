# BMS Suite: Postgres + optional backend/frontend
# Usage: docker compose up -d
# Then: backend uses DATABASE_URL=postgresql+psycopg://aimlbms:aimlbms@db:5432/aimlbms

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aimlbms
      POSTGRES_PASSWORD: aimlbms
      POSTGRES_DB: aimlbms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimlbms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
