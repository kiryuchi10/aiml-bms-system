services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aimlbms
      POSTGRES_PASSWORD: aimlbms
      POSTGRES_DB: aimlbms
    ports:
      - "5432:5432"
    volumes:
      - aimlbms_pgdata:/var/lib/postgresql/data

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://aimlbms:aimlbms@db:5432/aimlbms
      ALLOW_ORIGINS: http://localhost:5173
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -lc "pip install -r requirements.txt &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  aimlbms_pgdata:
